[project]
name = "roam-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Austin" }
]
requires-python = ">=3.14"
dependencies = [
    "click==8.3.1",
    "aiohttp>=3.14.3",
    "discord-py==2.6.4",
    "pyyaml==6.0.3",
    "requests==2.33.0",
]

[project.scripts]
roam-bot = "roam_bot:cli"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest-cov>=6.0.0",
    "pytest>=9.0.3",
]
